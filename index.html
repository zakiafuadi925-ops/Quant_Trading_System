    <script>
      // Suppress harmless Vite HMR WebSocket connection errors in iframe
      window.addEventListener('error', function(e) {
        if (e.message && (e.message.indexOf('WebSocket') !== -1 || e.message.indexOf('transport') !== -1)) {
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('unhandledrejection', function(e) {
        if (e.reason && (String(e.reason).indexOf('WebSocket') !== -1 || String(e.reason).indexOf('transport') !== -1)) {
          e.preventDefault();
        }
      });
    </script>
