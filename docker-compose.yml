# ============================================
# Quant Trading System v7.0.0 - Docker Compose
# Services: MongoDB 7, Express App, ML FastAPI
# ============================================

services:
  # ---- MongoDB 7 Database ----
  mongodb:
    image: mongo:7
    container_name: quant-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-quantadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-quantpass2024}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-quant_trading}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - quant-network

  # ---- Main Express + React Application ----
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quant-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3002}:3002"
    environment:
      NODE_ENV: production
      PORT: 3002
      MONGODB_URI: mongodb://${MONGO_USER:-quantadmin}:${MONGO_PASSWORD:-quantpass2024}@mongodb:27017/${MONGO_DB:-quant_trading}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      AES_VAULT_KEY: ${AES_VAULT_KEY:-change-me-aes-key-32chars-long!!}
      ML_SERVICE_URL: http://ml-service:8000
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      DISCORD_WEBHOOK_URL: ${DISCORD_WEBHOOK_URL:-}
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - quant-network

  # ---- ML Inference Microservice (FastAPI) ----
  ml-service:
    build:
      context: .
      dockerfile: Dockerfile.ml
    container_name: quant-ml
    restart: unless-stopped
    ports:
      - "${ML_PORT:-8000}:8000"
    environment:
      MODEL_DIR: /app/models
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ml_models:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - quant-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  ml_models:
    driver: local

networks:
  quant-network:
    driver: bridge
