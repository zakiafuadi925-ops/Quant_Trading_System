# ============================================
# Quant Trading System v7.0.0 - CI/CD Pipeline
# GitHub Actions: Lint → Test → Build → Docker
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ---- Job 1: Lint, Test & Build ----
  validate:
    name: Validate (Lint → Test → Build)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Lint & Typecheck
        run: npm run lint

      - name: Run Tests
        run: npm test -- --ci --maxWorkers=2

      - name: Build Production Assets
        run: npm run build

      - name: Report Bundle Size
        run: |
          echo "## 📦 Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          du -sh dist/assets/*.js dist/assets/*.css 2>/dev/null | sort -rh | head -20 >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          TOTAL=$(du -sh dist/ | cut -f1)
          echo "**Total dist size:** $TOTAL" >> $GITHUB_STEP_SUMMARY

  # ---- Job 2: Docker Build Validation ----
  docker:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build App Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: quant-trading-system:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ML Service Image (dry-run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.ml
          push: false
          tags: quant-ml-service:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
